<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Nūtrk</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 32px env(safe-area-inset-bottom);
      background: #ffffff; color: #1b1c1d; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    img { width: 132px; height: auto; margin-bottom: 40px; }
    p { margin: 0 0 32px; max-width: 280px; font-size: 17px; line-height: 1.45; color: #333333; }
    button {
      font: inherit; font-weight: 600; font-size: 16px; color: #fff; border: 0;
      padding: 14px 28px; border-radius: 999px; cursor: pointer;
      background: linear-gradient(90deg, #fe7031, #e94f22);
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <img src="nutrk-logo.svg" alt="nūtrk" />
  <p>sem conexão por aqui. assim que a internet voltar, a gente continua.</p>
  <button id="retry" type="button">tentar de novo</button>
  <script>
    // O Capacitor serve esta página no lugar do app remoto. "Tentar de novo" = navegar de volta pra ele.
    var APP_URL = "https://app.nutrk.io";
    document.getElementById("retry").addEventListener("click", function () {
      window.location.replace(APP_URL);
    });
    window.addEventListener("online", function () { window.location.replace(APP_URL); });
  </script>
</body>
</html>
